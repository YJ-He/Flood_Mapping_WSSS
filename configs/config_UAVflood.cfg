[Directory]
root_dir = ../Floodnet/data/mixed_dataset/UAV
save_dir = ${root_dir}/save
log_dir = ${save_dir}/log
test_dir = ${save_dir}/test
test_log_dir = ${test_dir}/log
pred_dir = ${test_dir}/predict
trainset_dir = ${root_dir}/train
validset_dir = ${root_dir}/val
testset_dir = ${root_dir}/test
data_folder_name = images
target_folder_name = labels
model_name = FCNs_vgg16_bn_ASPP_4conv1

[Data]
batch_size = 8
input_channel = 3
nb_classes = 2
input_size = 256
eval_size = 256
data_format = dir
; Per-channel mean/std for normalization (comma-separated).
; Run: python tools/compute_stats.py <train_images_dir> to compute these.
; Leave empty to skip normalization (data will be raw float32).
img_mean =
img_std =

[General]
use_gpu = True
use_multi_gpus = False
device_id = 0
random_seed = 1
num_workers = 4

[Optimizer]
lr_algorithm = adamw
init_lr = 0.0001
lr_decay = 0.1
momentum = 0.9
weight_decay = 2e-4
epsilon = 1e-8

[Train]
monitor = max/IoU
loss = crossentropy
use_amp = True
use_seed = True
is_ma_fcn = False
use_one_cycle_lr = True
temperature = 100
alpha = 0.4
beta = 1.0
sigma = 0.002
early_stop = 30
save_period = 1
dis_period = 100
epochs = 100
