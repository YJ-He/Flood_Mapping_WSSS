[Directory]
root_dir = ../Floodnet/data/mixed_dataset/GF
save_dir = ${root_dir}/save
log_dir = ${save_dir}/log
test_dir = ${save_dir}/test
test_log_dir = ${test_dir}/log
pred_dir = ${test_dir}/predict
trainset_dir = ${root_dir}/train
validset_dir = ${root_dir}/val
testset_dir = ${root_dir}/test
data_folder_name = images
target_folder_name = labels
model_name = FCNs_vgg16_bn_ASPP_4conv1

[Data]
batch_size = 8
input_channel = 5
nb_classes = 2
input_size = 256
eval_size = 256
test_size = 1024
slide_crop_size = 256
slide_stride = 170
data_format = dir
img_mean = 432.02181,315.92948,246.468659,310.61462,360.267789
img_std = 97.73313111900238,85.78646917160748,95.78015824658593,124.84677067613467,251.73965882246978

[General]
use_gpu = True
use_multi_gpus = False
device_id = 0
random_seed = 42
num_workers = 8

[Optimizer]
lr_algorithm = adamw
init_lr = 0.0001
lr_decay = 0.1
momentum = 0.9
weight_decay = 0.05
epsilon = 1e-8

[Train]
monitor = max/IoU
loss = crossentropy
use_amp = True
use_seed = True
is_ma_fcn = False
use_one_cycle_lr = False
use_warmup_poly_lr = True
temperature = 100
alpha = 0.4
beta = 1.0
sigma = 0.002
early_stop = 100
save_period = 10
dis_period = 100
epochs = 100
